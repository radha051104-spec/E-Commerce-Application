<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEase Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <h1 class="logo">Shop<span>Ease</span> Admin</h1>
    <a href="customers.html" class="nav-link">Customers</a>
    <a href="reports.html" class="nav-link">Reports</a>
    <a href="index.html" class="nav-link">Go to Shop</a>
    <span id="who" style="color:#fff"></span>
    <button class="btn" onclick="logout()">Logout</button>
    <button class="btn" id="seedBtn">Add sample products</button>
  </header>

  <main class="admin">
    <p id="msg" style="margin-bottom:12px;font-weight:600"></p>

    <form id="form" class="form">
      <input id="f_id" placeholder="Id (e.g. P021)" required>
      <input id="f_cat" placeholder="Category" required>
      <input id="f_title" placeholder="Title" required>
      <input id="f_des" placeholder="Description">
      <input id="f_price" type="number" placeholder="Price" required>
      <input id="f_qty" type="number" placeholder="Qty" required>
      <input id="f_img" placeholder="Image URL">
      <button class="btn">Save</button>
    </form>

    <div class="form" style="margin-top:12px">
      <select id="fCat"></select>
      <input id="fQ" placeholder="Search by Id or title">
    </div>

    <table>
      <thead><tr><th>Id</th><th>Category</th><th>Title</th><th>Price</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/firestore.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const PAGE_SIZE = 5;
    let editing = null, all = [], page = 1;

    // ---------- SAMPLE PRODUCTS ----------
    // [id, category, title, description, price, qty, image]
    const SAMPLE = [
      ["P001","Fashion","Men's Running Shoes","Lightweight daily trainers",1999,50,"shoes"],
      ["P002","Fashion","Women's Denim Jacket","Classic blue denim",1499,30,"jacket"],
      ["P003","Fashion","Leather Wallet","Slim bifold wallet",599,200,"wallet"],
      ["P004","Fashion","Cotton T-Shirt","Soft round-neck tee",399,150,"tshirt"],
      ["P005","Fashion","Women's Handbag","Spacious everyday tote",1299,25,"handbag"],
      ["P006","Fashion","Sunglasses","UV400 polarized",799,12,"sunglasses"],
      ["P007","Beauty","Matte Lipstick","Long-lasting colour",399,120,"lipstick"],
      ["P008","Beauty","Vitamin C Face Serum","Brightening serum 30ml",649,80,"serum"],
      ["P009","Beauty","Hair Care Combo","Shampoo + conditioner",549,14,"haircare"],
      ["P010","Beauty","Sunscreen SPF 50","Lightweight, no white cast",349,90,"sunscreen"],
      ["P011","Beauty","Perfume 50ml","Fresh floral fragrance",1199,40,"perfume"],
      ["P012","Beauty","Makeup Brush Set","10-piece soft brushes",699,35,"brushes"],
      ["P013","Lifestyle","Insulated Water Bottle","1L, keeps cold 24h",799,10,"bottle"],
      ["P014","Lifestyle","Yoga Mat","6mm non-slip",899,60,"yoga"],
      ["P015","Lifestyle","Backpack","Water-resistant 25L",1099,45,"backpack"],
      ["P016","Lifestyle","Scented Candle","Lavender, 40hr burn",449,110,"candle"],
      ["P017","Electronics","Wireless Earbuds","Bluetooth 5.3, 24hr battery",1799,70,"earbuds"],
      ["P018","Electronics","Smart Watch","Heart rate + sleep tracking",2999,20,"smartwatch"],
      ["P019","Electronics","Power Bank 10000mAh","Fast charging",999,13,"powerbank"],
      ["P020","Electronics","Bluetooth Speaker","Portable, waterproof",1499,55,"speaker"]
    ];

    g("seedBtn").onclick = async () => {
      g("seedBtn").disabled = true;
      let n = 0;
      for (const [id, cat, title, des, price, qty, img] of SAMPLE) {
        g("msg").textContent = `Adding products... ${++n}/${SAMPLE.length}`;
        await DB.create("products", id, {
          cat_id: cat, title, des, price, qty,
          img: `https://picsum.photos/seed/${img}/400/400`,
          active: true
        });
      }
      g("msg").textContent = "✅ All sample products added!";
      g("seedBtn").disabled = false;
      load();
    };

    // ---------- READ (filter + search + pagination) ----------
    function filtered() {
      const cat = g("fCat").value, q = g("fQ").value.trim().toLowerCase();
      return all.filter(p => (!cat || p.cat_id === cat) && (!q || (p.id + " " + p.title).toLowerCase().includes(q)));
    }

    function draw() {
      const list = filtered();
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      if (page > pages) page = pages;
      const slice = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

      g("rows").innerHTML = slice.map(p => `<tr>
        <td>${esc(p.id)}</td><td>${esc(p.cat_id)}</td><td>${esc(p.title)}</td>
        <td>₹${p.price}</td><td>${p.qty}</td>
        <td>${p.active === false ? "Inactive" : "Active"}</td>
        <td>
          <button onclick="edit('${p.id}')">Edit</button>
          <button onclick="toggle('${p.id}',${p.active !== false})">${p.active === false ? "Activate" : "Deactivate"}</button>
          <button onclick="del('${p.id}')">Delete</button>
        </td></tr>`).join("") || `<tr><td colspan="7">No products found.</td></tr>`;

      let h = `<button ${page === 1 ? "disabled" : ""} onclick="go(${page - 1})">Prev</button>`;
      for (let i = 1; i <= pages; i++) h += `<button class="${i === page ? "active" : ""}" onclick="go(${i})">${i}</button>`;
      h += `<button ${page === pages ? "disabled" : ""} onclick="go(${page + 1})">Next</button> Page ${page} of ${pages} (${list.length} items)`;
      g("pager").innerHTML = h;
    }
    function go(p) { page = p; draw(); }

    async function load() {
      all = await DB.list("products");
      all.sort((a, b) => a.id.localeCompare(b.id));
      const keep = g("fCat").value;
      const cats = [...new Set(all.map(p => p.cat_id))].sort();
      g("fCat").innerHTML = `<option value="">All categories</option>` + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
      g("fCat").value = cats.includes(keep) ? keep : "";
      draw();
    }
    g("fCat").onchange = () => { page = 1; draw(); };
    g("fQ").oninput = () => { page = 1; draw(); };

    // ---------- UPDATE ----------
    async function edit(id) {
      const p = await DB.get("products", id);
      editing = id;
      g("f_id").value = id; g("f_id").disabled = true;   // id cannot be changed
      g("f_cat").value = p.cat_id; g("f_title").value = p.title; g("f_des").value = p.des;
      g("f_price").value = p.price; g("f_qty").value = p.qty; g("f_img").value = p.img;
      window.scrollTo(0, 0);
    }
    async function toggle(id, isActive) {
      await DB.update("products", id, { active: !isActive });
      load();
    }

    // ---------- DELETE ----------
    async function del(id) {
      if (confirm("Delete this product permanently? Yes/No")) {
        await DB.remove("products", id);
        load();
      }
    }

    // ---------- CREATE / SAVE ----------
    g("form").onsubmit = async e => {
      e.preventDefault();
      const price = Number(g("f_price").value), qty = Number(g("f_qty").value);
      if (!(price > 0)) { g("msg").textContent = "Price must be more than 0."; return; }
      if (!Number.isInteger(qty) || qty < 0) { g("msg").textContent = "Quantity must be a whole number, 0 or more."; return; }
      const data = {
        cat_id: g("f_cat").value, title: g("f_title").value, des: g("f_des").value,
        price, qty,
        img: g("f_img").value || "https://picsum.photos/seed/default/400/400"
      };
      if (editing) {
        await DB.update("products", editing, data);      // keeps the current Active/Inactive status
      } else {
        if (all.some(p => p.id === g("f_id").value)) { g("msg").textContent = "This Id already exists."; return; }
        data.active = true;
        await DB.create("products", g("f_id").value, data);
      }
      editing = null; g("form").reset(); g("f_id").disabled = false;
      g("msg").textContent = "✅ Saved";
      load();
    };

    load();
  </script>
</body>
</html>
